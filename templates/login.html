<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Nox - Login</title>
</head>
<body>
   
<script> redirectUrl = {{ redirect_url | default(None) | tojson | safe }}; </script>


  <script src="{{ url_for('static', filename='scripts/notification.js') }}"></script>
  
  <script>
  

document.addEventListener("DOMContentLoaded", () => {
  const userStatus = {{ status|default(None)|tojson }};

  if (!userStatus) return;

  if (userStatus === "success") {
    showNotification("SUCCESS", "Login was successful", true)
    return;
  }

  if (userStatus === "failed") { 
    showNotification("LOGIN FAILED", "Login failed. Wrong username or password", false, true);
  }
 if (userStatus === "noexist") { 
    showNotification("ACCOUNT DOES NOT EXIST", "Account does not exist, create an account if you want to sign in.", false);
  }
});


</script>



    <div id="particles-js"></div>



<div class="container">

<h1 id="logintext">LOGIN</h1>

<form action="/login" method="POST">


<input placeholder="USERNAME" name="username" type="text" id="username"></input>
<input placeholder="PASSWORD" name="password" type="password" id="password"></input>
<button type="submit" value="Submit">SUBMIT</button>

</form>


<h2>If you do not have an account <a href="{{ url_for('register')}} ">create one</a></h2>


</div>
